    <div class="intro__inner">
      <p class="kicker" data-t="enveloppe.surtitre"></p>
      <div class="envelope" id="envelope" aria-hidden="true">

        <div class="env__card">

          <span class="card__date" data-t="dateTexte"></span>

        <div class="env__pocket"><i class="p-l"></i><i class="p-r"></i><i class="p-b"></i></div>
        <div class="env__flap"></div>
        <div class="env__seal"><span data-initiales></span></div>
      </div>
      <button class="btn btn--terra" id="openBtn" type="button" data-t="enveloppe.bouton"></button>

    <section class="section section--cream" id="histoire">
      <p class="kicker reveal" data-t="titres.histoireSur"></p>
      <h2 class="title split" data-t="titres.histoire"></h2>
      <div class="timeline" id="timeline">
        <div class="timeline__track"><div class="timeline__fill" id="timelineFill"></div></div>
        <ol class="timeline__list" id="storyList"></ol>
      </div>

      <h2 class="title split" data-t="titres.galerie"></h2>
      <div class="gallery" id="gallery"></div>
    </section>

    <section class="section section--cream" id="programme">
      <p class="kicker reveal" data-t="titres.programmeSur"></p>
      <h2 class="title split" data-t="titres.programme"></h2>
      <div class="program reveal"><ul class="program__list" id="programList"></ul></div>
    </section>

    <section class="section section--sand" id="lieu">
      <p class="kicker reveal" data-t="titres.lieuSur"></p>
      <h2 class="title split" data-t="titres.lieu"></h2>

`,So=`/* ===== Couleurs & polices (modifiables) ===== */
.inv{
  --cream:#F5ECDF;
  --cream-2:#EBDCC6;
  --paper:#FBF6EE;
  --terra:#B5583A;
  --terra-deep:#8E3E26;
  --terra-soft:#C9785A;
  --brown:#3B2418;
  --brown-2:#5A3828;
  --muted:#7D5F4E;
  --f-script:"Pinyon Script", cursive;
  --f-title:"Bodoni Moda", "Didot", serif;
  --f-caps:"Cinzel", serif;
  --f-text:"Jost", system-ui, sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1);
  --ease-io:cubic-bezier(.65,0,.25,1);
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0}
.inv{background:var(--cream);color:var(--brown);font:300 17px/1.65 var(--f-text);-webkit-font-smoothing:antialiased;overflow-x:hidden}
.inv.is-locked{overflow:hidden;height:100vh;height:100svh}
img{display:block;max-width:100%}
h1,h2,h3,p{margin:0}
.script{font-family:var(--f-script);font-weight:400;line-height:1}

/* ===== Petits \xE9l\xE9ments ===== */
.kicker{font:500 14px/1.4 var(--f-caps);letter-spacing:.32em;text-transform:uppercase;color:var(--terra);margin-bottom:14px}
.kicker--light{color:var(--cream-2)}
.title{font:400 clamp(32px,8.6vw,52px)/1.08 var(--f-title);letter-spacing:-.01em;color:var(--brown);max-width:14ch;margin:0 auto 44px}
.title--light{color:var(--paper)}
.lead{max-width:32ch;margin:0 auto 32px;color:var(--muted)}
.lead--light{color:var(--cream-2)}

.btn{display:inline-flex;align-items:center;justify-content:center;min-height:54px;padding:0 30px;border:0;border-radius:999px;font:500 14px/1 var(--f-caps);letter-spacing:.2em;text-transform:uppercase;text-decoration:none;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .6s var(--ease),background-color .6s var(--ease),box-shadow .6s var(--ease)}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:2px solid var(--terra);outline-offset:4px}
.btn--terra{background:var(--terra);color:var(--paper);box-shadow:0 10px 30px -12px rgba(var(--accent-rgb),.6)}
.btn--terra:hover{background:var(--terra-deep)}
.btn--cream{background:var(--paper);color:var(--terra-deep)}
.btn--cream:hover{background:var(--cream-2)}

/* ===== OUVERTURE ===== */
.intro{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px;
  background:radial-gradient(120% 80% at 50% 35%,var(--paper) 0%,var(--cream) 55%,var(--cream-2) 100%);
  transition:opacity 1.2s var(--ease),visibility 1.2s}
.intro.is-gone{opacity:0;visibility:hidden}
.intro__inner{display:flex;flex-direction:column;align-items:center;gap:34px;text-align:center}
.intro .kicker{margin:0;transition:opacity .8s var(--ease)}
.intro.is-opening .kicker,.intro.is-opening .btn{opacity:0;pointer-events:none}
.intro .btn{transition:opacity .6s var(--ease),transform .6s var(--ease),background-color .6s}

.envelope{position:relative;width:min(84vw,360px);aspect-ratio:1.48/1;perspective:1400px;animation:float 6s ease-in-out infinite}
.intro.is-opening .envelope{animation:none}
@keyframes float{50%{transform:translateY(-6px)}}
.env__back{position:absolute;inset:0;border-radius:6px;background:var(--terra-deep);box-shadow:0 30px 60px -28px rgba(var(--dark-rgb),.6)}
.env__card{position:absolute;left:5%;right:5%;top:5%;bottom:5%;z-index:2;border-radius:3px;background:var(--paper);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px;
  box-shadow:inset 0 0 0 1px rgba(var(--accent-rgb),.25),inset 0 0 0 7px var(--paper),inset 0 0 0 8px rgba(var(--accent-rgb),.35);
  transition:transform 1.5s var(--ease-io)}
.card__kicker{font:500 12px/1 var(--f-caps);letter-spacing:.3em;text-transform:uppercase;color:var(--terra)}
